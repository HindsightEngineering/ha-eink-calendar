# ESPHome firmware for the Seeed reTerminal E1003 (10.3", 1872x1404, 16 gray levels).
#
# Each wake: read battery -> join Wi-Fi -> ask Home Assistant whether the image
# changed -> if so download the PNG and redraw -> deep sleep for as long as HA
# says. No ESPHome API connection is used, so a wake takes a few seconds.
#
# Requires ESPHome 2026.7.0+ (it8951 display platform). Fill secrets.yaml first
# (see secrets.example.yaml); eink_device_id and eink_token come from the
# integration's setup screen in Home Assistant.

substitutions:
  name: eink-calendar
  friendly_name: E-Ink Calendar
  # Use HA's LAN IP rather than homeassistant.local: mDNS lookups cost wake time.
  ha_base_url: !secret eink_ha_base_url
  device_id: !secret eink_device_id
  token: !secret eink_token

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  on_boot:
    - priority: 600
      then:
        # Battery divider is only powered while GPIO40 is high.
        - output.turn_on: battery_enable
    - priority: -100
      then:
        - script.execute: wake_cycle

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

# Octal PSRAM is required for the 1872x1404 framebuffer and the decoded PNG.
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # A static IP skips DHCP and shortens every wake. Uncomment and fill in:
  # manual_ip:
  #   static_ip: 192.168.0.60
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.0.1
  ap:
    ssid: "E-Ink Calendar Setup"
    password: !secret fallback_ap_password

captive_portal:

http_request:
  verify_ssl: false
  timeout: 15s

globals:
  # Hash of the image currently on the panel; survives deep sleep via flash.
  - id: shown_hash
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  - id: pending_hash
    type: std::string
    initial_value: '""'
  - id: wake_reason
    type: std::string
    initial_value: '"boot"'
  - id: need_redraw
    type: bool
    initial_value: "false"
  - id: stay_awake
    type: bool
    initial_value: "false"
  - id: sleep_seconds
    type: int
    initial_value: "1800"

output:
  - platform: gpio
    id: battery_enable
    pin: GPIO40

sensor:
  - platform: adc
    id: battery_voltage
    pin: GPIO1
    attenuation: 12db
    update_interval: never
    accuracy_decimals: 3
    filters:
      - multiply: 2.0 # 2:1 divider on the board
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: never

binary_sensor:
  # Green button: also the deep-sleep wake pin. While awake (keep-awake mode)
  # a press forces an immediate check.
  - platform: gpio
    id: refresh_button
    pin:
      number: GPIO3
      inverted: true
      mode:
        input: true
        pullup: true
      allow_other_uses: true
    on_press:
      # Only while held awake; a press that woke the device is handled by wake_cycle.
      - if:
          condition:
            lambda: return id(stay_awake);
          then:
            - lambda: id(wake_reason) = "button";
            - script.execute: check_status

spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

image:
  - platform: online_image
    id: calendar_image
    url: ${ha_base_url}/api/eink_calendar/${device_id}/image.png?token=${token}
    format: PNG
    type: GRAYSCALE
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - component.update: epaper
      - lambda: |-
          id(shown_hash) = id(pending_hash);
          ESP_LOGI("calendar", "Redrew image %s", id(shown_hash).c_str());
      # GC16 full refresh takes about 3 s; let it finish before sleeping.
      - delay: 4s
      - script.execute: finish_cycle
    on_error:
      - logger.log:
          level: WARN
          format: "Image download failed; retrying in 15 min"
      - globals.set:
          id: sleep_seconds
          value: "900"
      - script.execute: finish_cycle

display:
  - platform: it8951
    id: epaper
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1003
    update_interval: never
    grayscale: true
    update_mode: GC16
    full_update_every: 1
    # From Seeed's cookbook. If the image is mirrored or upside down on your
    # unit, flip mirror_x / mirror_y or add `rotation: 180`.
    transform:
      mirror_x: true
      mirror_y: false
    lambda: |-
      it.image(0, 0, id(calendar_image));

deep_sleep:
  id: deep_sleep_ctrl
  # Safety net: if anything hangs, sleep anyway after 2 minutes.
  run_duration: 120s
  sleep_duration: 30min
  wakeup_pin:
    number: GPIO3
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

interval:
  # Only matters in keep-awake mode: poll HA every minute until it's switched off.
  - interval: 60s
    then:
      - if:
          condition:
            lambda: return id(stay_awake);
          then:
            - lambda: id(wake_reason) = "awake";
            - script.execute: check_status

script:
  - id: wake_cycle
    then:
      - lambda: |-
          switch (esp_sleep_get_wakeup_cause()) {
            case ESP_SLEEP_WAKEUP_EXT0:
            case ESP_SLEEP_WAKEUP_EXT1:
              id(wake_reason) = "button";
              break;
            case ESP_SLEEP_WAKEUP_TIMER:
              id(wake_reason) = "timer";
              break;
            default:
              id(wake_reason) = "boot";
          }
      # Let the divider settle after GPIO40 went high, then sample.
      - delay: 20ms
      - component.update: battery_voltage
      - output.turn_off: battery_enable
      - wait_until:
          condition: wifi.connected
          timeout: 20s
      - if:
          condition:
            not: wifi.connected
          then:
            - logger.log:
                level: WARN
                format: "No Wi-Fi; sleeping 15 min"
            - globals.set:
                id: sleep_seconds
                value: "900"
            - script.execute: finish_cycle
          else:
            - component.update: wifi_rssi
            - script.execute: check_status

  - id: check_status
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            char q[160];
            snprintf(q, sizeof(q), "&battery_v=%.3f&rssi=%d&hash=%s&wake=%s",
                     isnan(id(battery_voltage).state) ? 0.0f : id(battery_voltage).state,
                     isnan(id(wifi_rssi).state) ? 0 : (int) id(wifi_rssi).state,
                     id(shown_hash).c_str(), id(wake_reason).c_str());
            return std::string("${ha_base_url}/api/eink_calendar/${device_id}/status?token=${token}") + q;
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  id(need_redraw) = false;
                  if (response->status_code != 200) {
                    ESP_LOGW("calendar", "Status HTTP %d", response->status_code);
                    id(sleep_seconds) = 900;
                    return;
                  }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    id(need_redraw) = root["redraw"] | false;
                    id(stay_awake) = root["stay_awake"] | false;
                    id(sleep_seconds) = root["sleep_s"] | 1800;
                    id(pending_hash) = std::string(root["hash"] | "");
                    return true;
                  });
                  ESP_LOGI("calendar", "redraw=%d sleep=%ds stay_awake=%d",
                           id(need_redraw), id(sleep_seconds), id(stay_awake));
              - if:
                  condition:
                    lambda: return id(need_redraw);
                  then:
                    - component.update: calendar_image # -> on_download_finished
                  else:
                    - script.execute: finish_cycle
          on_error:
            - logger.log:
                level: WARN
                format: "Status request failed; retrying in 15 min"
            - globals.set:
                id: sleep_seconds
                value: "900"
            - script.execute: finish_cycle

  - id: finish_cycle
    mode: single
    then:
      - if:
          condition:
            lambda: return id(stay_awake);
          then:
            - logger.log: "Keep-awake is on: staying up for OTA (turn the switch off in HA to resume sleeping)"
            - deep_sleep.prevent: deep_sleep_ctrl
          else:
            - deep_sleep.enter:
                id: deep_sleep_ctrl
                sleep_duration: !lambda return (uint32_t) id(sleep_seconds) * 1000;

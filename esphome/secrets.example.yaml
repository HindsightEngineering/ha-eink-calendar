# Copy to secrets.yaml (next to the firmware YAML, or merge into your ESPHome Builder secrets).
wifi_ssid: "YourIoTNetwork"
wifi_password: "your-wifi-password"
fallback_ap_password: "change-me-too"
ota_password: "choose-an-ota-password"

# Home Assistant base URL as seen from the display's network. Use the LAN IP.
eink_ha_base_url: "http://192.168.0.10:8123"

# Shown on the integration's last setup step (and under Configure afterwards).
eink_device_id: "kitchen_calendar"
eink_token: "paste-the-token-here"
